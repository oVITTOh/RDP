name: RDP

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  secure-rdp:
    runs-on: windows-latest
    # GitHub-hosted jobs have a maximum runtime of 6 hours.
    timeout-minutes: 360

    steps:
      - name: Configure RDP
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $terminalServerKey = 'HKLM:\System\CurrentControlSet\Control\Terminal Server'
          $rdpTcpKey = 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp'

          # Enable Remote Desktop; keep NLA and TLS enabled.
          Set-ItemProperty -Path $terminalServerKey -Name 'fDenyTSConnections' -Value 0 -Force
          Set-ItemProperty -Path $rdpTcpKey -Name 'UserAuthentication' -Value 1 -Force
          Set-ItemProperty -Path $rdpTcpKey -Name 'SecurityLayer' -Value 2 -Force

          # Generate a random password for this temporary runner.
          $alphabet = 'ABCDEFGHJKLMNPQRSTUVWXYZabcdefghijkmnopqrstuvwxyz23456789!@#$%^&*()-_=+'
          $randomBytes = [byte[]]::new(24)
          [System.Security.Cryptography.RandomNumberGenerator]::Fill($randomBytes)
          $password = -join ($randomBytes | ForEach-Object { $alphabet[$_ % $alphabet.Length] })
          $securePassword = ConvertTo-SecureString $password -AsPlainText -Force

          $existingUser = Get-LocalUser -Name 'RDP' -ErrorAction SilentlyContinue
          if ($null -eq $existingUser) {
            New-LocalUser -Name 'RDP' -Password $securePassword -AccountNeverExpires -PasswordNeverExpires -Description 'Temporary RDP account' | Out-Null
          } else {
            Set-LocalUser -Name 'RDP' -Password $securePassword -PasswordNeverExpires $true
            Enable-LocalUser -Name 'RDP'
          }

          # Grant the account Remote Desktop access and Administrator privileges on this disposable runner.
          Add-LocalGroupMember -Group 'Administrators' -Member 'RDP' -ErrorAction SilentlyContinue
          $rdpGroup = Get-LocalGroup -SID 'S-1-5-32-555'
          $groupMembers = @(Get-LocalGroupMember -Group $rdpGroup.Name -ErrorAction SilentlyContinue)
          if (-not ($groupMembers | Where-Object { $_.Name -match '\\RDP$' })) {
            Add-LocalGroupMember -Group $rdpGroup.Name -Member "$env:COMPUTERNAME\RDP"
          }

          Set-Service -Name 'TermService' -StartupType Automatic
          if ((Get-Service -Name 'TermService').Status -ne 'Running') {
            Start-Service -Name 'TermService'
          } else {
            Restart-Service -Name 'TermService' -Force
          }

          # Save credentials for the final step; they are deliberately displayed there for the user.
          "RDP_PASSWORD=$password" >> $env:GITHUB_ENV

      - name: Install Tailscale
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $tsExe = Join-Path $env:ProgramFiles 'Tailscale\tailscale.exe'

          if (-not (Test-Path -LiteralPath $tsExe)) {
            $tsUrl = 'https://pkgs.tailscale.com/stable/tailscale-setup-1.102.4-amd64.msi'
            $installerPath = Join-Path $env:TEMP 'tailscale.msi'

            Invoke-WebRequest -Uri $tsUrl -OutFile $installerPath
            $arguments = '/i "{0}" /qn /norestart' -f $installerPath
            $installer = Start-Process -FilePath 'msiexec.exe' -ArgumentList $arguments -Wait -PassThru
            Remove-Item -LiteralPath $installerPath -Force -ErrorAction SilentlyContinue

            if ($installer.ExitCode -notin @(0, 3010)) {
              throw "Tailscale installation failed with exit code $($installer.ExitCode)."
            }
            $tsExe = Join-Path $env:ProgramFiles 'Tailscale\tailscale.exe'
          }

          if (-not (Test-Path -LiteralPath $tsExe)) {
            throw 'Tailscale executable was not found after installation.'
          }

      - name: Connect Tailscale and verify RDP
        shell: pwsh
        env:
          TAILSCALE_AUTH_KEY: ${{ secrets.TAILSCALE_AUTH_KEY }}
        run: |
          $ErrorActionPreference = 'Stop'
          $tsExe = Join-Path $env:ProgramFiles 'Tailscale\tailscale.exe'

          if ([string]::IsNullOrWhiteSpace($env:TAILSCALE_AUTH_KEY)) {
            throw 'Missing repository secret TAILSCALE_AUTH_KEY. Add it under Settings > Secrets and variables > Actions.'
          }

          & $tsExe up "--authkey=$env:TAILSCALE_AUTH_KEY" "--hostname=gh-runner-$env:GITHUB_RUN_ID" --accept-dns=false
          if ($LASTEXITCODE -ne 0) {
            throw 'Tailscale failed to connect. Check the TAILSCALE_AUTH_KEY secret.'
          }

          $tsIP = $null
          for ($attempt = 0; $attempt -lt 20; $attempt++) {
            $candidate = & $tsExe ip -4 2>$null | Select-Object -First 1
            if ($candidate) { $tsIP = ([string]$candidate).Trim() }
            if ($tsIP) { break }
            Start-Sleep -Seconds 3
          }
          if (-not $tsIP) { throw 'Tailscale did not assign an IPv4 address.' }

          $tsAdapter = Get-NetAdapter -IncludeHidden | Where-Object {
            $_.Name -match 'Tailscale' -or $_.InterfaceDescription -match 'Tailscale'
          } | Select-Object -First 1
          if (-not $tsAdapter) { throw 'Tailscale network adapter was not found.' }

          # Restrict inbound RDP to the Tailscale network, not the public internet.
          Get-NetFirewallRule -DisplayName 'RDP-Tailscale' -ErrorAction SilentlyContinue | Remove-NetFirewallRule
          Get-NetFirewallRule -DisplayName 'RDP over Tailscale' -ErrorAction SilentlyContinue | Remove-NetFirewallRule
          Get-NetFirewallRule -Name 'RemoteDesktop-UserMode-In-TCP' -ErrorAction SilentlyContinue | Disable-NetFirewallRule
          Get-NetFirewallRule -Name 'RemoteDesktop-UserMode-In-UDP' -ErrorAction SilentlyContinue | Disable-NetFirewallRule
          New-NetFirewallRule -DisplayName 'RDP over Tailscale' -Direction Inbound -Action Allow -Protocol TCP -LocalPort 3389 -InterfaceAlias $tsAdapter.Name -RemoteAddress '100.64.0.0/10' -Profile Any | Out-Null

          $listener = $null
          for ($attempt = 0; $attempt -lt 10; $attempt++) {
            $listener = Get-NetTCPConnection -State Listen -LocalPort 3389 -ErrorAction SilentlyContinue
            if ($listener) { break }
            Start-Sleep -Seconds 3
          }
          if (-not $listener) { throw 'RDP is not listening on TCP port 3389.' }

          $testResult = Test-NetConnection -ComputerName $tsIP -Port 3389 -WarningAction SilentlyContinue
          if (-not $testResult.TcpTestSucceeded) {
            throw 'The TCP connectivity test to RDP failed. Check the listener and firewall.'
          }

          Write-Host ''
          Write-Host '========== RDP ACCESS =========='
          Write-Host "Address:  $tsIP"
          Write-Host 'Username: RDP'
          Write-Host "Password: $env:RDP_PASSWORD"
          Write-Host '================================'

          $summary = @"
          ## RDP ACCESS

          - **Address:** $tsIP
          - **Username:** RDP
          - **Password:** $env:RDP_PASSWORD

          Enter these values in your Remote Desktop client while this workflow is running. This temporary runner is deleted after the job ends.
          "@
          $summary | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8

      - name: Maintain connection
        shell: pwsh
        run: |
          while ($true) {
            Write-Host "[$(Get-Date)] RDP is active; the GitHub-hosted runner will stop when the job time limit is reached."
            Start-Sleep -Seconds 300
          }
